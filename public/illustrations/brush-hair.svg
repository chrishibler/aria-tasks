<svg width="200" height="200" viewBox="0 0 200 200" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Brush hair</title>
<desc>A soft pastel illustration of a pink paddle hairbrush with hair ties, representing the brush hair routine.</desc>
<rect x="0" y="0" width="200" height="200" rx="16" fill="#fdeee8"/>

<g transform="rotate(-10 100 100)">
  <!-- handle -->
  <rect x="86" y="104" width="28" height="70" rx="14" fill="#f4a0d0"/>
  <rect x="94" y="116" width="6" height="40" rx="3" fill="white" opacity="0.35"/>
  <!-- hanging hole -->
  <circle cx="100" cy="164" r="5" fill="#fdeee8"/>

  <!-- paddle head -->
  <ellipse cx="100" cy="72" rx="40" ry="44" fill="#f4a0d0"/>
  <!-- bristle cushion -->
  <ellipse cx="100" cy="72" rx="31" ry="35" fill="#f8c8e4"/>

  <!-- bristles -->
  <circle cx="88" cy="48" r="3" fill="#e480b8"/>
  <circle cx="100" cy="46" r="3" fill="#e480b8"/>
  <circle cx="112" cy="48" r="3" fill="#e480b8"/>
  <circle cx="76" cy="62" r="3" fill="#e480b8"/>
  <circle cx="88" cy="61" r="3" fill="#e480b8"/>
  <circle cx="100" cy="60" r="3" fill="#e480b8"/>
  <circle cx="112" cy="61" r="3" fill="#e480b8"/>
  <circle cx="124" cy="62" r="3" fill="#e480b8"/>
  <circle cx="76" cy="76" r="3" fill="#e480b8"/>
  <circle cx="88" cy="75" r="3" fill="#e480b8"/>
  <circle cx="100" cy="74" r="3" fill="#e480b8"/>
  <circle cx="112" cy="75" r="3" fill="#e480b8"/>
  <circle cx="124" cy="76" r="3" fill="#e480b8"/>
  <circle cx="82" cy="90" r="3" fill="#e480b8"/>
  <circle cx="94" cy="89" r="3" fill="#e480b8"/>
  <circle cx="106" cy="89" r="3" fill="#e480b8"/>
  <circle cx="118" cy="90" r="3" fill="#e480b8"/>
  <circle cx="90" cy="101" r="3" fill="#e480b8"/>
  <circle cx="102" cy="101" r="3" fill="#e480b8"/>

  <!-- rim highlight -->
  <ellipse cx="72" cy="46" rx="9" ry="5" fill="white" opacity="0.4" transform="rotate(-35 72 46)"/>
</g>

<!-- hair ties -->
<circle cx="44" cy="156" r="11" fill="none" stroke="#a8d8f0" stroke-width="6"/>
<circle cx="64" cy="168" r="8" fill="none" stroke="#f4d080" stroke-width="5"/>

<!-- sparkles -->
<text x="150" y="62" font-size="13" font-family="sans-serif" fill="#f4a0d0">✦</text>
<text x="161" y="88" font-size="9" font-family="sans-serif" fill="#f4a0d0">✦</text>
<text x="44" y="60" font-size="10" font-family="sans-serif" fill="#f4a0d0">✦</text>
</svg>
