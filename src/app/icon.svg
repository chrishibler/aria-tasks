<svg width="64" height="64" viewBox="0 0 64 64" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Calico kitten</title>
<desc>A flat pastel calico kitten face with white, ginger and dark patches.</desc>

<rect x="0" y="0" width="64" height="64" rx="14" fill="#f7b8d4"/>

<!-- ears (drawn first so the head hides their bases) -->
<path d="M6 31 L11 4 L33 21 Z" fill="#ffffff"/>
<path d="M58 31 L53 4 L31 21 Z" fill="#f0993c"/>
<path d="M12 27 L15 11 L26 19 Z" fill="#f28fb4"/>
<path d="M52 27 L49 11 L38 19 Z" fill="#f28fb4"/>

<!-- head, sized to fill the tile so it survives a 16px downscale -->
<ellipse cx="32" cy="37" rx="25" ry="20" fill="#ffffff"/>

<!-- calico patches: ginger one side, dark the other -->
<ellipse cx="45" cy="29" rx="9" ry="8" fill="#f0993c"/>
<ellipse cx="19" cy="28" rx="8.5" ry="7.5" fill="#544741"/>
<ellipse cx="49" cy="42" rx="6" ry="5" fill="#f0993c" opacity="0.9"/>

<!-- eyes -->
<ellipse cx="24" cy="39" rx="3.6" ry="4.3" fill="#332c28"/>
<ellipse cx="40" cy="39" rx="3.6" ry="4.3" fill="#332c28"/>
<circle cx="25.4" cy="37.5" r="1.2" fill="#ffffff"/>
<circle cx="41.4" cy="37.5" r="1.2" fill="#ffffff"/>

<!-- nose and mouth -->
<path d="M28.6 45.6 L35.4 45.6 L32 49.6 Z" fill="#ef7fa8"/>
<path d="M32 49.6 L32 51.2" stroke="#7d635b" stroke-width="1.4" stroke-linecap="round"/>
<path d="M32 51.2 Q28.4 53.6 25.8 51" fill="none" stroke="#7d635b" stroke-width="1.4" stroke-linecap="round"/>
<path d="M32 51.2 Q35.6 53.6 38.2 51" fill="none" stroke="#7d635b" stroke-width="1.4" stroke-linecap="round"/>
</svg>
